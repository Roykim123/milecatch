name: refresh-seats
# 매일 KE 좌석 데이터 갱신 → index.html 재생성 → 커밋.
# 안전규칙: schedule은 수동(workflow_dispatch) 성공 검증 후에만 추가한다.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'   # 매일 04:00 KST (수동런 성공검증 완료 후 무장)
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install curl_cffi
      - name: crawl (KE, 4개국 × 연말)
        run: python ke_crawl.py
      - name: regenerate page
        run: |
          python gen_demo2.py
          cp award_demo.html index.html
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "auto: refresh KE seats data"
          for i in 1 2 3; do
            git pull --rebase --autostash origin master && git push && exit 0 || sleep 4
          done
          echo "push failed after retries"; exit 1
